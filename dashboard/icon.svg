<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#2a1305"/>
      <stop offset="0.45" stop-color="#110803"/>
      <stop offset="1" stop-color="#030201"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ff6a00" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff1df"/>
      <stop offset="0.35" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ff7a1a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <circle cx="256" cy="256" r="230" fill="url(#core)"/>

  <!-- äußerer Ring mit Skala -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#ff7a1a" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ff7a1a" stroke-opacity="0.55" stroke-width="6"
          stroke-dasharray="2 8.26" />
  <!-- Reactor-Segmente -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="174" fill="none" stroke="#ff7a1a" stroke-width="14"
            stroke-dasharray="72 19.1" transform="rotate(-81 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#ffd2a6" stroke-width="3"
          stroke-dasharray="72 19.1" transform="rotate(-81 256 256)" stroke-opacity="0.8"/>
  <!-- Glas-Scheibe -->
  <circle cx="256" cy="256" r="146" fill="#0a0503" fill-opacity="0.75"/>
  <circle cx="256" cy="256" r="146" fill="url(#glass)"/>
  <circle cx="256" cy="256" r="146" fill="none" stroke="#ff9a4a" stroke-opacity="0.7" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#ff7a1a" stroke-opacity="0.25" stroke-width="1.5"
          stroke-dasharray="40 10"/>

  <!-- F -->
  <g filter="url(#glow)">
    <path d="M190 160 H330 L312 196 H232 V238 H300 L284 272 H232 V352 L190 352 Z" fill="url(#letter)"/>
  </g>
  <path d="M190 160 H330 L312 196 H232 V238 H300 L284 272 H232 V352 L190 352 Z"
        fill="none" stroke="#fff4e6" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Glanzlicht -->
  <path d="M120 200 A146 146 0 0 1 330 128" fill="none" stroke="#ffffff" stroke-opacity="0.25"
        stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
</svg>
