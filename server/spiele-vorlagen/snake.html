<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon-Schlange</title>
<style>
  :root { --neon: #ff8a1e; --cyan: #2ee6d0; --bg: #050505; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #ffe7cc; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
  .hud { display: flex; gap: 18px; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
  .hud b { color: var(--neon); text-shadow: 0 0 8px var(--neon); font-size: 18px; }
  canvas { border: 1px solid rgba(255,138,30,.6); border-radius: 10px; box-shadow: 0 0 24px rgba(255,138,30,.25), inset 0 0 30px rgba(255,138,30,.08); background: #090604; max-width: 100%; }
  .pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 50px); gap: 6px; }
  .pad button { border: 1px solid rgba(255,138,30,.55); background: rgba(255,138,30,.08); color: var(--neon); border-radius: 12px; font-size: 22px; touch-action: none; }
  .pad button:active { background: rgba(255,138,30,.3); }
  .pad .up { grid-column: 2; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,.72); text-align: center; padding: 20px; }
  .overlay h1 { margin: 0; color: var(--neon); letter-spacing: .2em; text-shadow: 0 0 14px var(--neon); font-size: 30px; }
  .overlay p { margin: 0; opacity: .85; line-height: 1.5; }
  .overlay button { margin-top: 8px; padding: 12px 26px; border-radius: 999px; border: 1px solid var(--neon); background: rgba(255,138,30,.18); color: #fff; font-size: 16px; letter-spacing: .1em; }
  .hidden { display: none; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>Punkte <b id="punkte">0</b></span><span>Rekord <b id="rekord">0</b></span></div>
  <canvas id="feld" width="400" height="400"></canvas>
  <div class="pad" aria-label="Steuerung">
    <button class="up" data-d="0,-1" aria-label="Hoch">▲</button>
    <button class="left" data-d="-1,0" aria-label="Links">◀</button>
    <button class="down" data-d="0,1" aria-label="Runter">▼</button>
    <button class="right" data-d="1,0" aria-label="Rechts">▶</button>
  </div>
</div>
<div class="overlay" id="overlay">
  <h1>NEON-SCHLANGE</h1>
  <p id="info">Friss die leuchtenden Kerne und werde länger.<br>Pfeiltasten / WASD oder Wischen und Steuerkreuz.</p>
  <button id="start">Start</button>
</div>
<script>
(() => {
  const N = 20;
  const feld = document.getElementById("feld");
  const ctx = feld.getContext("2d");
  const overlay = document.getElementById("overlay");
  let schlange, richtung, naechste, futter, punkte, laeuft = false, takt = 0, tempo = 130;
  let rekord = 0;
  try { rekord = Number(localStorage.getItem("neon-schlange-rekord")) || 0; } catch (e) {}
  document.getElementById("rekord").textContent = rekord;

  function groesse() {
    const s = Math.floor(Math.min(window.innerWidth - 20, window.innerHeight - 190, 560) / N) * N;
    feld.style.width = feld.style.height = Math.max(200, s) + "px";
  }
  window.addEventListener("resize", groesse); groesse();

  function neu() {
    schlange = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    richtung = { x: 1, y: 0 }; naechste = richtung; punkte = 0; tempo = 130;
    document.getElementById("punkte").textContent = 0;
    setzeFutter();
  }
  function setzeFutter() {
    do { futter = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (schlange.some((t) => t.x === futter.x && t.y === futter.y));
  }
  function lenke(x, y) {
    if (!laeuft) return;
    if (x === -richtung.x && y === -richtung.y) return;
    naechste = { x, y };
  }
  function schritt() {
    richtung = naechste;
    const kopf = { x: schlange[0].x + richtung.x, y: schlange[0].y + richtung.y };
    if (kopf.x < 0 || kopf.y < 0 || kopf.x >= N || kopf.y >= N || schlange.some((t) => t.x === kopf.x && t.y === kopf.y)) return ende();
    schlange.unshift(kopf);
    if (kopf.x === futter.x && kopf.y === futter.y) {
      punkte += 10; tempo = Math.max(60, tempo - 3);
      document.getElementById("punkte").textContent = punkte;
      setzeFutter();
    } else schlange.pop();
  }
  function ende() {
    laeuft = false;
    if (punkte > rekord) { rekord = punkte; try { localStorage.setItem("neon-schlange-rekord", rekord); } catch (e) {} }
    document.getElementById("rekord").textContent = rekord;
    document.getElementById("info").innerHTML = "Game Over – " + punkte + " Punkte.<br>Rekord: " + rekord;
    document.getElementById("start").textContent = "Nochmal";
    overlay.classList.remove("hidden");
  }
  function zeichne(t) {
    const z = feld.width / N;
    ctx.fillStyle = "#090604"; ctx.fillRect(0, 0, feld.width, feld.height);
    ctx.strokeStyle = "rgba(255,138,30,.06)";
    for (let i = 1; i < N; i++) { ctx.beginPath(); ctx.moveTo(i * z, 0); ctx.lineTo(i * z, feld.height); ctx.moveTo(0, i * z); ctx.lineTo(feld.width, i * z); ctx.stroke(); }
    const puls = 0.6 + Math.sin(t / 160) * 0.4;
    ctx.shadowBlur = 18 * puls; ctx.shadowColor = "#2ee6d0"; ctx.fillStyle = "#2ee6d0";
    ctx.beginPath(); ctx.arc(futter.x * z + z / 2, futter.y * z + z / 2, z * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = "#ff8a1e";
    schlange.forEach((teil, i) => {
      ctx.shadowBlur = i === 0 ? 20 : 10;
      ctx.fillStyle = i === 0 ? "#ffd2a0" : "rgba(255,138,30," + Math.max(0.35, 1 - i / schlange.length) + ")";
      ctx.fillRect(teil.x * z + 2, teil.y * z + 2, z - 4, z - 4);
    });
    ctx.shadowBlur = 0;
  }
  function schleife(t) {
    if (laeuft && t - takt > tempo) { takt = t; schritt(); }
    zeichne(t);
    requestAnimationFrame(schleife);
  }
  function start() { neu(); laeuft = true; overlay.classList.add("hidden"); }

  document.getElementById("start").addEventListener("click", start);
  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    const m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
    if (m) { e.preventDefault(); lenke(m[0], m[1]); }
    if ((k === " " || k === "enter") && !laeuft) { e.preventDefault(); start(); }
  });
  document.querySelectorAll(".pad button").forEach((b) => b.addEventListener("pointerdown", (e) => { e.preventDefault(); const [x, y] = b.dataset.d.split(",").map(Number); lenke(x, y); }));
  let sx = 0, sy = 0;
  feld.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  feld.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) lenke(Math.sign(dx), 0); else lenke(0, Math.sign(dy));
  }, { passive: true });
  neu();
  requestAnimationFrame(schleife);
})();
</script>
</body>
</html>
